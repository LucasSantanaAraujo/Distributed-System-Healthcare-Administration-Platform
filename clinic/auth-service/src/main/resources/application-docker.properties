spring.application.name=auth-service
server.port=8080


# =========================
# ACTUATOR + PROBES + PROMETHEUS
# =========================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus

# Liveness/Readiness endpoints:
management.endpoint.health.probes.enabled=true

# (opcional) para veres detalhes no /health (ÃÂºtil em dev)
management.endpoint.health.show-details=always
management.server.port=8080


# =========================
# CHAVES INTERNAS / URLS
# =========================
internal.api.key=12345
app.doctors-service.url=http://doctors-service:8080
app.clients-service.url=http://clients-service:8080
app.upload-dir=uploads

# =========================
# RabbitMQ (jÃÂÃÂÃÂÃÂ¡ tinhas)
# =========================
spring.rabbitmq.host=${APP_RABBITMQ_HOST}
spring.rabbitmq.port=${APP_RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.retry.enabled=true

# =========================
# PostgreSQL - Supabase
# =========================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true




spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=60000


# =========================
# OpenTelemetry (OTLP) -> otel-collector
# =========================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces



# =========================
# KEYCLOAK (opção A)
# =========================



keycloak.internal-base-url=http://keycloak:8080/keycloak
keycloak.public.base-url=http://clinic.local/keycloak

keycloak.realm=clinic

keycloak.client-id=postman
keycloak.client-secret=

keycloak.admin.username=admin
keycloak.admin.password=admin

# Resource Server (validar tokens vindos do Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://clinic.local/keycloak/realms/clinic

