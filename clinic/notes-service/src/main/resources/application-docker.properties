spring.application.name=notes-service
server.port=8080

# MongoDB (no cluster Kubernetes, via Service "mongo" no namespace clinic)
spring.data.mongodb.uri=mongodb://mongo:27017/notesdb

# Actuator / Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework=INFO
logging.level.com.psoft.clinic=DEBUG

# JWT
app.jwt.secret=my-ultra-long-secret-key-for-hs512-authentication-very-secure-and-unique-2025!
app.jwt.expiration=86400000

# URLs dos outros serviços
app.auth-service.url=http://auth-service:8080
app.clients-service.url=http://clients-service:8080
app.doctors-service.url=http://doctors-service:8080
app.appointments-service.url=http://appointments-service:8080

# Chave interna
internal.api.key=12345


spring.rabbitmq.host=${APP_RABBITMQ_HOST}
spring.rabbitmq.port=${APP_RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.retry.enabled=true


