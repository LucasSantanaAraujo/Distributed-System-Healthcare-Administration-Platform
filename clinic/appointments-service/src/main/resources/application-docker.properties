spring.application.name=appointments-service
server.port=8080

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:appointmentsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

management.endpoint.health.show-details=always



logging.level.org.springframework=INFO
logging.level.com.psoft.clinic=DEBUG

# JWT
app.jwt.secret=my-ultra-long-secret-key-for-hs512-authentication-very-secure-and-unique-2025!

app.jwt.expiration=86400000

# URLs internas

clients.service.url=http://clients-service:8080
doctors.service.url=http://doctors-service:8080

# Chaves internas (essenciais!)

clients.service.internal-key=12345
auth.service.internal-key=12345
debug=true
doctors.service.internal-key=${internal.api.key}
internal.api.key=12345




