<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Registo de Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="text-center mb-4">Registo de Paciente</h3>
            <form method="post" action="/register/patient">
                <div class="mb-3">
                    <label class="form-label">Nome:</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Palavra-passe:</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Data de Nascimento:</label>
                    <input type="date" class="form-control" name="birthDate" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telemóvel:</label>
                    <input type="text" class="form-control" name="phone" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Seguro de Saúde:</label>
                    <input type="text" class="form-control" name="insuranceInfo" required>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="consent" id="consent" required>
                    <label class="form-check-label" for="consent">
                        Concordo com a política de privacidade.
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Registar</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
