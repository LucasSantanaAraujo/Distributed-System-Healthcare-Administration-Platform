spring.application.name=clients-service
server.port=8080
spring.profiles.active=docker


spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:clientsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework=INFO
logging.level.com.clinic.clients=DEBUG

# JWT (igual ao auth-service, necessÃÂÃÂ¡rio se validar tokens)
app.jwt.secret=my-ultra-long-secret-key-for-hs512-authentication-very-secure-and-unique-2025!
app.jwt.expiration=86400000

# ComunicaÃÂÃÂ§ÃÂÃÂ£o entre serviÃÂÃÂ§os
app.auth-service.url=http://auth-service:8080
app.appointments-service.url=http://appointments-service:8080

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
internal.api.key=12345
