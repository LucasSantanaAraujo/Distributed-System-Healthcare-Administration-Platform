# ==========================
# ?? CONFIGURAÇÕES GERAIS
# ==========================

# Porta automática (Docker escolhe uma livre)
server.port=${SERVER_PORT:0}

# Base de dados H2 (em memória para container)
spring.datasource.url=jdbc:h2:mem:doctorsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html

# ==========================
# ? LOGGING
# ==========================
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.psoft.clinic=DEBUG

# ==========================
# ? SEGURANÇA
# ==========================
internal.api.key=abakaxi
app.jwt.secret=G4nZ7w9xT2sB8kQ5rL0pF1vY3eD6jN8hC2uA4mW7tR9sE5yU6oP3lH8bJ1dV0zK9qR2nT5mY8xW3cV7
