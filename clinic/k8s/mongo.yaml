apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: clinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: clinic
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
