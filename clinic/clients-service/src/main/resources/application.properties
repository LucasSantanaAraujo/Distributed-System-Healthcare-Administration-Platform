spring.application.name=clients-service
server.port=8081
# Alterei para 8081 para evitar conflito se o appointments-service rodar no 8080

# --- MONGODB CONFIG ---
spring.data.mongodb.uri=mongodb://localhost:27017/hap_clients_db
# Removemos as configs de datasource/JPA/H2 pois já não são usadas

# --- RABBITMQ CONFIG (Para a Saga) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- RESILIENCE4J CONFIG (Circuit Breaker) ---
# O nome 'identityService' deve corresponder ao usado na anotação @CircuitBreaker no Java
resilience4j.circuitbreaker.instances.identityService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.identityService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.identityService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.identityService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.identityService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.identityService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.identityService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.identityService.eventConsumerBufferSize=10

# --- ACTUATOR (Necessário para o Resilience4j monitorizar estado) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.health.circuitbreakers.enabled=true

# --- LOGGING ---
logging.level.org.springframework=INFO
logging.level.com.psoft.clinic=DEBUG
logging.level.io.github.resilience4j=DEBUG

# --- SECURITY (Mantido do teu original) ---
app.jwt.secret=my-ultra-long-secret-key-for-hs512-authentication-very-secure-and-unique-2025!
app.jwt.expiration=86400000
internal.api.key=12345

# URLs Externos (Ajustados para validação)
# Se estiveres a correr localmente sem Docker, usa localhost e as portas respetivas
app.auth-service.url=http://localhost:8085
app.appointments-service.url=http://localhost:8080