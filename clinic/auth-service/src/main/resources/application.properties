spring.application.name=auth-service
server.port=8080
spring.profiles.active=docker


spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework=INFO
logging.level.com.clinic.auth=DEBUG

# JWT e seguranÃÂ§a
app.jwt.secret=my-ultra-long-secret-key-for-hs512-authentication-very-secure-and-unique-2025!
app.jwt.expiration=86400000

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
