# Porta configurável por variável de ambiente
server.port=${SERVER_PORT:8080}

# H2 persistente, mas com URL configurável (cada instância aponta para um ficheiro/pasta diferente)
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:file:./data/clinicdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

# H2 console (opcional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT parametrizado (podes manter o mesmo entre instâncias ou definir um por instância)
app.jwt.secret=${JWT_SECRET:segredo123}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
