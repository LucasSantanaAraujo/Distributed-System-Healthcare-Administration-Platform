spring.application.name=auth-service
server.port=8080

spring.datasource.driverClassName=org.h2.Driver
    spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework=INFO
logging.level.com.psoft.clinic=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.server.port=8080

# JWT
app.jwt.secret=my-ultra-long-secret-key-for-hs512-authentication-very-secure-and-unique-2025!
app.jwt.expiration=86400000

# ComunicaÃÂÃÂ§ÃÂÃÂ£o interna
internal.api.key=12345
# URL do serviço dos médicos (doctors-service)
app.doctors-service.url=http://doctors-service:8080

app.upload-dir=uploads
# Mostra todos os logs detalhados do Spring Boot
logging.level.root=INFO

# Se quiseres ver as chamadas HTTP feitas com RestTemplate
logging.level.org.springframework.web.client.RestTemplate=DEBUG

