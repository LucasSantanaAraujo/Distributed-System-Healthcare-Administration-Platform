apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: clinic
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "appointments-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["appointments-service:8080"]

      - job_name: "auth-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["auth-service:8080"]

      - job_name: "clients-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["clients-service:8080"]

      - job_name: "doctors-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["doctors-service:8080"]

      - job_name: "notes-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["notes-service:8080"]
