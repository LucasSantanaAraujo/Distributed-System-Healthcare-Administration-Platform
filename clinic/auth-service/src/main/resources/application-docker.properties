# ==========================
# ?? CONFIGURAÇÕES GERAIS
# ==========================
spring.application.name=auth-service
server.port=${SERVER_PORT:0}

# ==========================
# ?? BASE DE DADOS (H2 em memória)
# ==========================
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 console acessível via Docker
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# ==========================
# ? LOGGING (debug SQL + segurança)
# ==========================
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.com.psoft.clinic=DEBUG

# ==========================
# ? JWT CONFIG
# ==========================
app.jwt.secret=G4nZ7w9xT2sB8kQ5rL0pF1vY3eD6jN8hC2uA4mW7tR9sE5yU6oP3lH8bJ1dV0zK9qR2nT5mY8xW3cV7
app.jwt.expiration=3600000

# ==========================
# ? SERVIÇOS INTERNOS (rede Docker)
# ==========================
clients.service.url=http://clients-service:8080
doctors.service.url=http://doctors-service:8080
appointments.service.url=http://appointments-service:8080
notes.service.url=http://notes-service:8080

