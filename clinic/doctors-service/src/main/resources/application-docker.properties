# ==========================
# ? SERVIÇOS INTERNOS
# ==========================
appointments.service.url=http://appointments-service:8080
clients.service.url=http://clients-service:8080
auth.service.url=http://auth-service:8080

# ==========================
# ? OUTROS
# ==========================
spring.main.allow-bean-definition-overriding=true
