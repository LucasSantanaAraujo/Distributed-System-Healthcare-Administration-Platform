# ==========================
# ?? CONFIGURAÇÕES GERAIS
# ==========================
spring.application.name=clients-service
server.port=${SERVER_PORT:0}

# Base de dados H2 em memória
spring.datasource.url=jdbc:h2:mem:clientsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# ==========================
# ? SEGURANÇA
# ==========================
internal.api.key=abakaxi
app.jwt.secret=G4nZ7w9xT2sB8kQ5rL0pF1vY3eD6jN8hC2uA4mW7tR9sE5yU6oP3lH8bJ1dV0zK9qR2nT5mY8xW3cV7
app.jwt.expiration=3600000

# ==========================
# ? SERVIÇOS INTERNOS (URLs dentro da rede Docker)
# ==========================
doctors.service.url=http://doctors-service:8080
appointments.service.url=http://appointments-service:8080
notes.service.url=http://notes-service:8080
auth.service.url=http://auth-service:8080

# ==========================
# ? LOGGING
# ==========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.psoft.clinic=DEBUG
