apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-service
  namespace: clinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-service
  template:
    metadata:
      labels:
        app: notes-service
    spec:
      containers:
        - name: notes-service
          image: notes-service
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            - name: APP_RABBITMQ_HOST
              value: "rabbitmq"

            - name: APP_RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password

            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: OTEL_SERVICE_NAME
              value: "notes-service"
            - name: OTEL_LOG_LEVEL
              value: "debug"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OTEL_JAVAAGENT_DEBUG
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opentelemetry-javaagent.jar"




          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 150
            periodSeconds: 20
            failureThreshold: 6
