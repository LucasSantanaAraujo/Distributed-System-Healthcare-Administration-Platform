version: "3.9"

services:
  # ======================
  # 🔐 AUTH SERVICE
  # ======================
  auth-service:
    image: clinic-auth-service:latest
    ports:
      - "8081:8080"  # Acede via http://localhost:8081
    networks:
      - clinic-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ======================
  # 🩺 DOCTORS SERVICE
  # ======================
  doctors-service:
    image: clinic-doctors-service:latest
    networks:
      - clinic-net
    depends_on:
      - auth-service
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ======================
  # 👤 CLIENTS SERVICE
  # ======================
  clients-service:
    image: clinic-clients-service:latest
    networks:
      - clinic-net
    depends_on:
      - auth-service
      - doctors-service
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ======================
  # 📅 APPOINTMENTS SERVICE
  # ======================
  appointments-service:
    image: clinic-appointments-service:latest
    networks:
      - clinic-net
    depends_on:
      - clients-service
      - doctors-service
      - auth-service
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ======================
  # 🗒️ NOTES SERVICE
  # ======================
  notes-service:
    image: clinic-notes-service:latest
    networks:
      - clinic-net
    depends_on:
      - appointments-service
      - auth-service
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure


  # ======================
  # ⚙️ AUTOSCALER (Script simples)
  # ======================
  autoscaler:
    image: docker:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./autoscaler.sh:/autoscaler.sh
    networks:
      - clinic-net
    deploy:
      replicas: 1
    command: sh -c "apk add --no-cache curl jq && sh /autoscaler.sh"

# 🌐 Rede interna Docker
networks:
  clinic-net:
    external: true
